<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu respuesta · Tribu Henko V-120</title>
<meta name="description" content="Responde la invitación de la Tribu Henko V-120.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#D21F1F">
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="apple-touch-icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#F4F1ED;--card:#FFFFFF;--tx:#1C1A19;--tx2:#5E5853;--tx3:#8F8882;--bd:#E4DFD9;--ac:#D21F1F;--sombra:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0D0C0C;--card:#191717;--tx:#F4F1EE;--tx2:#BDB5AD;--tx3:#8A827B;--bd:#2F2B29;--ac:#FF5A5A;--sombra:none}}
.legado{--ac:#0B6E91;--bg:#EEF6FA;--bd:#D5E5EE;--tx:#14212A;--tx2:#4C5E69;--tx3:#7D8E98}
@media (prefers-color-scheme:dark){.legado{--ac:#6FD0F0;--bg:#0A1116;--card:#13202A;--bd:#253744;--tx:#EEF5F9;--tx2:#B5C5CF;--tx3:#83959F}}
html{min-height:100%}body{min-height:100vh}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:28px 16px 40px;text-align:center}
.logos{display:flex;justify-content:center;align-items:center;gap:18px}
.logos img{height:84px;width:auto}
.logos .piel{display:none}
.legado .logos{flex-direction:column;gap:6px}
.legado .logos .piel{display:block;height:136px;order:1}
.legado .logos .henko{display:none}
.cambiar{background:none;border:0;color:var(--tx2);font:600 14px Montserrat,system-ui,sans-serif;text-decoration:underline;cursor:pointer;margin-top:14px}
.preg{margin:20px 0 8px;font-weight:700;font-size:16px;text-align:left}
.ayuda{margin:-4px 0 10px;color:var(--tx2);font-size:14px;text-align:left}
.chips{display:flex;flex-direction:column;gap:8px;text-align:left}
.chip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;font-size:16px;cursor:pointer;background:var(--card)}
.chip input{width:20px;height:20px;accent-color:var(--ac);margin:0;flex:none}
.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--card))}
.campo{width:100%;box-sizing:border-box;border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;font:16px Montserrat,system-ui,sans-serif;background:var(--card);color:var(--tx)}
.campo:focus{outline:2px solid var(--ac);outline-offset:1px}
.err{color:#C62828;font-size:14px;margin:8px 0 0;text-align:left;min-height:1px}
.enviar{margin-top:20px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sombra);padding:24px 18px 18px;margin-top:18px;border-top:5px solid var(--ac)}
h1{margin:0 0 4px;font-size:21px;line-height:1.3}
.sub{margin:0 0 18px;color:var(--tx2);font-size:15px}
.msg{font-size:17px;line-height:1.55;margin:0 0 18px}
.msg strong{color:var(--ac)}
.nota{margin:14px 0 10px;color:var(--tx2);font-size:15px}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 6px}
.b{appearance:none;border:0;border-radius:24px;padding:12px 20px;font:700 16px Montserrat,system-ui,sans-serif;color:#fff;cursor:pointer;text-decoration:none;display:inline-block;min-width:120px}
.b[disabled]{opacity:.55;cursor:default}
.b:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.extra{border-top:1px solid var(--bd);margin-top:16px;padding-top:16px}
.extra p{margin:0 0 12px;font-size:15px;line-height:1.5}
.cargando{color:var(--tx2);font-size:15px;padding:18px 0}
.det{white-space:pre-line;margin:8px auto 14px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--ac) 10%,var(--card));color:var(--tx);font-size:15px;line-height:1.6;text-align:left;display:inline-block}
.hola{margin:2px 0 14px;text-align:center;font-size:16px;color:var(--tx)}
.coord p{margin:0 0 10px}
.punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin:0 3px;animation:p 1s infinite ease-in-out}
.punto:nth-child(2){animation-delay:.15s}.punto:nth-child(3){animation-delay:.3s}
@keyframes p{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.punto{animation:none}}
footer{margin-top:18px;color:var(--tx3);font-size:13px}
.area .valor{display:none;margin:8px 0 6px 32px;text-align:left}.area.on .valor{display:block}
.ayuda2{margin:4px 0 0;color:var(--tx3);font-size:13px;text-align:left}
.lb{display:block;font-weight:600;font-size:14px;margin:12px 0 6px;text-align:left}
.opc{font-weight:400;color:var(--tx3)}
.fila{display:flex;gap:8px}.fila .chip{flex:1;justify-content:center}
select.campo{appearance:none;-webkit-appearance:none}
.cuentab{background:color-mix(in srgb,var(--ac) 8%,var(--card));border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;margin:0 0 10px}
</style>
</head>
<body>
<main>
  <div class="logos"><img class="henko" src="../assets/logo.png" alt="Tribu Henko V-120"><img class="piel" src="../assets/logo-legado.png" alt="Legado Piel de Ángel"></div>
  <div class="card" id="card" aria-live="polite">
    <div class="cargando" id="cargando"><span class="punto"></span><span class="punto"></span><span class="punto"></span><p>Cargando…</p></div>
  </div>
  <footer>Tribu Henko V-120</footer>
</main>
<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbx65fG9CJsgVDX0rhgzdNXwJ52ahDx_A92Zlg9dGRraegVWk8PQhcDVQP788giDitxw6Q/exec";
  var q = new URLSearchParams(location.search);
  var r = q.get('r') || '';
  var card = document.getElementById('card');
  var COLORES = { si: '#1E9E5A', quizas: '#D99A00', no: '#8A8580' };
  // v24: el enlace dice si es del Legado (empieza con "L|"): la página sale con los colores del Legado desde que abre
  try { var t0 = r.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'); if (/^L\|/.test(atob(t0 + '==='.slice((t0.length + 3) % 4)))) { document.documentElement.classList.add('legado'); document.body.classList.add('legado'); document.title = 'Legado Piel de Ángel · Tribu Henko V-120'; var ft = document.querySelector('footer'); if (ft) ft.textContent = 'Legado Piel de Ángel · Tribu Henko V-120'; var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', '#0B6E91'); } } catch (e) { /* enlace viejo */ }

  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function txt(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function cargando() {
    card.innerHTML = '<div class="cargando"><span class="punto"></span><span class="punto"></span><span class="punto"></span><p>Un momento…</p></div>';
  }
  function error(a, ok) {
    card.innerHTML = '';
    card.appendChild(el('p', { 'class': 'msg' }, 'No pudimos conectar. Revisa tu internet e inténtalo de nuevo.'));
    var b = el('button', { 'class': 'b', type: 'button', style: 'background:var(--ac)' }, 'Intentar de nuevo');
    b.onclick = function () { pedir(a, ok); };
    card.appendChild(b);
  }
  var LF = null, EX = null;
  // v25: el servidor a veces tarda: se espera hasta 90 segundos, se avisa si tarda y se intenta otra vez sola
  function pedir(a, ok, extra, intento) {
    cargando();
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, 90000);
    var lento = setTimeout(function () { var c = card.querySelector('.cargando p'); if (c) c.textContent = 'Estamos cargando tu invitación… un momentito más.'; }, 8000);
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', cache: 'no-store', redirect: 'follow',
      body: JSON.stringify({ accion: 'respuesta', datos: Object.assign({ r: r, a: a || '', ok: ok ? '1' : '' }, extra || {}) }), signal: ctl ? ctl.signal : undefined })
      .then(function (x) { return x.json(); })
      .then(function (j) {
        clearTimeout(t); clearTimeout(lento);
        // v27: si el sistema está ocupado (salen muchos correos), se espera un poco y se intenta otra vez sola
        if (j && j.ocupado && (intento || 0) < 4) { var c = card.querySelector('.cargando p'); if (c) c.textContent = 'Hay mucho movimiento… lo intentamos otra vez en unos segundos.'; return setTimeout(function () { pedir(a, ok, extra, (intento || 0) + 1); }, 5000); }
        if (!j || !j.ok || !j.pagina) throw new Error('sin datos'); pintar(j.pagina);
      })
      .catch(function () { clearTimeout(t); clearTimeout(lento); if (!intento) pedir(a, ok, extra, 1); else error(a, ok); });
  }
  function boton(x, texto, ok) {
    var b = el('button', { 'class': 'b', type: 'button', style: 'background:' + (COLORES[x] || 'var(--ac)') }, txt(texto));
    b.onclick = function () { pedir(x, ok); };
    return b;
  }
  // Saludo con el nombre: el enlace es personal y la respuesta queda a nombre de quien lo recibió
  // v25: fecha, hora y lugar de la actividad (solo en el link de la tribu)
  function cabeza(p) {
    card.appendChild(el('h1', {}, txt(p.titulo)));
    if (p.detalles) card.appendChild(el('div', { 'class': 'det' }, txt(p.detalles)));
    else if (p.sub) card.appendChild(el('p', { 'class': 'sub' }, txt(p.sub)));
  }
  function hola(p) { if (p.hola) card.appendChild(el('p', { 'class': 'hola' }, 'Hola, <strong>' + txt(p.hola) + '</strong> 👋')); }
  // Legado: botón para escribirle por WhatsApp a quien coordina (Elizabeth)
  function coordina(p) {
    if (!p.coordina || !p.coordina.wa) return;
    var w = el('div', { 'class': 'extra coord' });
    w.appendChild(el('p', {}, '¿Quieres entregar una donación o tienes alguna pregunta?'));
    var bw = el('div', { 'class': 'btns' });
    bw.appendChild(enlace(p.coordina.wa, 'Escribirle a ' + String(p.coordina.nombre || '').split(' ')[0], '#1E9E5A'));
    w.appendChild(bw); card.appendChild(w);
  }
  function enlace(url, texto, color) {
    return el('a', { 'class': 'b', href: url, target: '_blank', rel: 'noopener', style: 'background:' + color }, txt(texto));
  }
  // v41: cada área que marque abre su cajita: la donación pide el monto y cómo la entrega (efectivo → a quién de la tribu; transferencia → la cuenta);
  // las demás, el valor aproximado (opcional)
  function opc(t) { return txt(t) + ' <span class="opc">(opcional)</span>'; }
  function fmtNum(d) { d = String(d || '').replace(/\D/g, '').slice(0, 9); return d ? Number(d).toLocaleString('en-US') : ''; }
  function bloqueApoyo(areas, S, tribu) {
    var c2 = el('div', { 'class': 'chips' });
    areas.forEach(function (ar) {
      var don = /donaci/i.test(ar), on = S.areas.indexOf(ar) >= 0;
      var w = el('div', { 'class': 'area' + (on ? ' on' : '') });
      var l = el('label', { 'class': 'chip' + (on ? ' on' : '') }), i = el('input', { type: 'checkbox' }); i.checked = on;
      l.appendChild(i); l.appendChild(el('span', {}, txt(ar))); w.appendChild(l);
      var box = el('div', { 'class': 'valor' });
      var v = el('input', { 'class': 'campo', type: 'text', inputmode: 'numeric', maxlength: '12', placeholder: don ? 'Monto en RD$. Ej.: 2,000' : 'Valor aproximado en RD$', 'aria-label': (don ? 'Monto de la donación en RD$' : 'Valor aproximado en RD$') + ': ' + ar });
      v.value = fmtNum(S.valores[ar]);
      v.oninput = function () { v.value = fmtNum(v.value); S.valores[ar] = v.value.replace(/\D/g, ''); };
      box.appendChild(v);
      if (!don) box.appendChild(el('p', { 'class': 'ayuda2' }, 'Opcional: si no sabes cuánto vale, déjalo en blanco.'));
      else {
        box.appendChild(el('p', { 'class': 'lb' }, '¿Cómo vas a entregar tu donación?'));
        var fg = el('div', { 'class': 'fila', role: 'radiogroup' }), ew = el('div', { style: 'display:none;margin-top:4px' });
        [['Efectivo', '💵 Efectivo'], ['Transferencia', '🏦 Transferencia']].forEach(function (o) {
          var lo = el('label', { 'class': 'chip' + (S.forma === o[0] ? ' on' : '') }), io = el('input', { type: 'radio', name: 'forma' }); io.checked = S.forma === o[0];
          io.onchange = function () { S.forma = o[0]; [].forEach.call(fg.children, function (x) { x.classList.toggle('on', x === lo); }); ew.style.display = o[0] === 'Efectivo' && tribu.length ? 'block' : 'none'; };
          lo.appendChild(io); lo.appendChild(el('span', {}, txt(o[1]))); fg.appendChild(lo);
        });
        box.appendChild(fg);
        if (tribu && tribu.length) {
          ew.appendChild(el('label', { 'class': 'lb', 'for': 'entrega' }, opc('¿A quién de la tribu se lo entregas?')));
          var se = el('select', { 'class': 'campo', id: 'entrega' }); se.appendChild(el('option', { value: '' }, 'Elige a la persona'));
          tribu.forEach(function (n) { se.appendChild(el('option', { value: n }, txt(n))); });
          se.value = S.entrega || ''; se.onchange = function () { S.entrega = se.value; };
          ew.appendChild(se); ew.style.display = S.forma === 'Efectivo' ? 'block' : 'none';
          box.appendChild(ew);
        }
      }
      w.appendChild(box);
      i.onchange = function () { var k = S.areas.indexOf(ar); if (i.checked && k < 0) S.areas.push(ar); if (!i.checked && k >= 0) S.areas.splice(k, 1); l.classList.toggle('on', i.checked); w.classList.toggle('on', i.checked); };
      c2.appendChild(w);
    });
    return c2;
  }
  // "Tu apoyo: …" con el valor de cada área y la forma de la donación
  function tuApoyo(lf) {
    var l = (lf.areas || []).map(function (a) { var v = lf.valores && lf.valores[a]; return a + (v ? ' (RD$' + Number(v).toLocaleString('en-US') + ')' : '') + (/donaci/i.test(a) && lf.forma ? ' · ' + lf.forma.toLowerCase() : ''); });
    return 'Tu apoyo: ' + l.join(', ') + (lf.detalle ? ' · ' + lf.detalle : '');
  }
  // Transferencia: la cuenta del Legado y el botón para enviar el comprobante
  function pago(p) {
    if (!p.pago) return;
    var w = el('div', { 'class': 'extra' });
    if (p.pago.cuenta) { w.appendChild(el('p', {}, '<strong>🏦 Puedes hacer tu transferencia a nuestra cuenta:</strong>')); w.appendChild(el('div', { 'class': 'cuentab' }, p.pago.cuenta)); }
    if (p.pago.comprobante) { w.appendChild(el('p', {}, '¿Ya la hiciste? Envíanos tu comprobante:')); var bw = el('div', { 'class': 'btns' }); bw.appendChild(enlace(p.pago.comprobante, 'Enviar comprobante', '#1E9E5A')); w.appendChild(bw); }
    card.appendChild(w);
  }
  // Legado: ¿cómo participarás? + ¿cómo vas a apoyar? (varias) + monto si es donación + detalle
  function formLegado(p) {
    var f = p.legadoForm, act = f.actual || {}, sel = { a: p.confirmar || act.a || '', areas: (act.areas || []).slice(), valores: Object.assign({}, act.valores || {}), forma: act.forma || '', entrega: act.entrega || '', detalle: act.detalle || '' };
    if (!sel.entrega && f.contacto && (f.tribu || []).indexOf(f.contacto) >= 0) sel.entrega = f.contacto;   // v42: precargado con quien lo trajo al Legado
    card.innerHTML = '';
    cabeza(p);
    hola(p);
    if (act.a) card.appendChild(el('p', { 'class': 'nota' }, 'Puedes cambiar tu respuesta aquí.'));
    card.appendChild(el('p', { 'class': 'preg' }, txt('¿Vas a ir a ' + p.titulo + '?')));
    var c1 = el('div', { 'class': 'chips', role: 'radiogroup' });
    Object.keys(f.opciones).forEach(function (k) {
      var l = el('label', { 'class': 'chip' + (sel.a === k ? ' on' : '') });
      var i = el('input', { type: 'radio', name: 'q1', value: k }); if (sel.a === k) i.checked = true;
      i.onchange = function () { sel.a = k; [].forEach.call(c1.children, function (x) { x.classList.toggle('on', x === l); }); };
      l.appendChild(i); l.appendChild(el('span', {}, txt(f.opciones[k]))); c1.appendChild(l);
    });
    card.appendChild(c1);
    card.appendChild(el('p', { 'class': 'preg' }, 'Vayas o no, ¿cómo te gustaría apoyar?'));
    card.appendChild(el('p', { 'class': 'ayuda' }, 'Puedes elegir varias.'));
    card.appendChild(bloqueApoyo(f.areas, sel, f.tribu || []));
    card.appendChild(el('p', { 'class': 'preg' }, '¿Puedes especificar cómo vas a apoyar tu Legado?'));
    var det = el('textarea', { 'class': 'campo', rows: '3', maxlength: '600', placeholder: 'Opcional: qué vas a aportar, cuánto o cualquier detalle' }); det.value = sel.detalle;
    card.appendChild(det);
    var er = el('p', { 'class': 'err', role: 'alert' }); card.appendChild(er);
    var b = el('button', { 'class': 'b enviar', type: 'button', style: 'background:var(--ac)' }, 'Enviar mi respuesta');
    b.onclick = function () {
      if (!sel.a) { er.textContent = 'Dinos si vas a ir.'; return; }
      var don = sel.areas.some(function (x) { return /donaci/i.test(x); });
      if (don && !sel.forma) { er.textContent = 'Dinos cómo vas a entregar tu donación: en efectivo o por transferencia.'; return; }
      var vs = {}; sel.areas.forEach(function (x) { if (sel.valores[x]) vs[x] = sel.valores[x]; });
      pedir(sel.a, true, { areas: sel.areas, valores: vs, forma: don ? sel.forma : '', entrega: don && sel.forma === 'Efectivo' ? sel.entrega : '', detalle: det.value.trim() });
    };
    card.appendChild(b);
  }
  function pintar(p) {
    document.body.classList.toggle('legado', !!p.legado);
    document.documentElement.classList.toggle('legado', !!p.legado);
    if (p.legadoForm && !p.cerrada && (p.confirmar || !p.legadoForm.actual || p.editar)) { formLegado(p); return; }
    document.title = p.titulo && p.titulo !== 'Tribu Henko V-120' ? p.titulo + ' · Tribu Henko V-120' : 'Tu respuesta · Tribu Henko V-120';
    card.innerHTML = '';
    cabeza(p);
    if (!(p.legadoForm && !p.cerrada)) hola(p);
    card.appendChild(el('div', { 'class': 'msg' }, p.html));
    // v25: Legado ya respondido: agradecimiento → su apoyo → Elizabeth → calendario o comunidad → "Cambiar mi respuesta"
    if (p.legadoForm && !p.cerrada && !p.confirmar) {
      var lf0 = p.legadoForm.actual;
      if (lf0 && (lf0.areas.length || lf0.detalle)) card.appendChild(el('p', { 'class': 'nota' }, txt(tuApoyo(lf0))));
      pago(p);
      coordina(p);
      if (p.calendario) {
        var k0 = el('div', { 'class': 'extra' }); k0.appendChild(el('p', {}, p.calendario.texto));
        var kb0 = el('div', { 'class': 'btns' }); kb0.appendChild(enlace(p.calendario.google, 'Google Calendar (Android)', '#1A73E8')); kb0.appendChild(enlace(p.calendario.ics, 'iPhone (Apple)', '#111111'));
        k0.appendChild(kb0); card.appendChild(k0);
      }
      if (p.grupo) {
        var g0 = el('div', { 'class': 'extra' }); g0.appendChild(el('p', {}, p.grupo.texto));
        var gb0 = el('div', { 'class': 'btns' }); gb0.appendChild(enlace(p.grupo.url, p.grupo.boton, '#1E9E5A'));
        g0.appendChild(gb0); card.appendChild(g0);
      }
      var cb0 = el('button', { 'class': 'cambiar', type: 'button' }, 'Cambiar mi respuesta');
      cb0.onclick = function () { pintar(Object.assign({}, p, { editar: true, confirmar: '' })); };
      card.appendChild(cb0);
      return;
    }
    var bot = p.botones || { si: 'Sí voy', quizas: 'Quizás', no: 'No voy' };
    if (p.confirmar) {
      var c = el('div', { 'class': 'btns' });
      c.appendChild(boton(p.confirmar, 'Confirmar', true));
      card.appendChild(c);
    }
    if (p.calendario) {
      var k = el('div', { 'class': 'extra' });
      k.appendChild(el('p', {}, p.calendario.texto));
      var kb = el('div', { 'class': 'btns' });
      kb.appendChild(enlace(p.calendario.google, 'Google Calendar (Android)', '#1A73E8'));
      kb.appendChild(enlace(p.calendario.ics, 'iPhone (Apple)', '#111111'));
      k.appendChild(kb);
      card.appendChild(k);
    }
    if (p.grupo) {
      var g = el('div', { 'class': 'extra' });
      g.appendChild(el('p', {}, p.grupo.texto));
      var gb = el('div', { 'class': 'btns' });
      gb.appendChild(enlace(p.grupo.url, p.grupo.boton, '#1E9E5A'));
      g.appendChild(gb);
      card.appendChild(g);
    }
    if (p.legadoForm && !p.cerrada) {
      var lf = p.legadoForm.actual;

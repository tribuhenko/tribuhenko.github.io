        if (tribu && tribu.length) {
          ew.appendChild(el('label', { 'class': 'lb', 'for': 'entrega' }, '¿A qué líder de la tribu se lo entregas?'));
          var se = el('select', { 'class': 'campo', id: 'entrega' }); se.appendChild(el('option', { value: '' }, 'Elige al líder'));
          tribu.forEach(function (n) { se.appendChild(el('option', { value: n }, txt(n))); });
          se.value = tribu.indexOf(S.entrega) >= 0 ? S.entrega : ''; S.entrega = se.value; se.onchange = function () { S.entrega = se.value; };
          ew.appendChild(se); ew.appendChild(el('p', { 'class': 'ayuda2' }, 'Esa persona será la responsable de hacerlo llegar.'));
          ew.style.display = S.forma === 'Efectivo' ? 'block' : 'none';
          box.appendChild(ew); campos.entrega = se;
        }
      }
      w.appendChild(box);
      i.onchange = function () { var x = S.areas.indexOf(ar); if (i.checked && x < 0) S.areas.push(ar); if (!i.checked && x >= 0) S.areas.splice(x, 1); l.classList.toggle('on', i.checked); w.classList.toggle('on', i.checked); };
      c2.appendChild(w);
    });
    c2.campos = campos; c2.tribu = tribu || [];
    return c2;
  }
  // v47: lo que hace falta según lo que marcó (el aviso sale debajo del campo)
  function revisarApoyo(S, bq, er) {
    var c = bq.campos || {}, din = S.areas.filter(function (x) { return DIN.test(x); })[0], otro = S.areas.some(function (x) { return OTRO.test(x); });
    if (din && !S.valores[din]) return aviso(er, 'Escribe el monto de tu aporte económico.', c.monto);
    if (din && !S.forma) return aviso(er, 'Dinos cómo vas a entregar tu aporte: en efectivo o por transferencia.', c.forma);
    if (din && S.forma === 'Efectivo' && bq.tribu.length && !S.entrega) return aviso(er, 'Elige a qué líder de la tribu le entregas el efectivo.', c.entrega);
    if (otro && !String(S.detalle || '').trim()) return aviso(er, 'Cuéntanos qué otro aporte harás.', c.otro);
    return true;
  }
  function valoresDe(S) { var o = {}; S.areas.forEach(function (a) { if (S.valores[a]) o[a] = S.valores[a]; }); return o; }
  // Transferencia: la cuenta del Legado y el botón para enviar el comprobante
  function pagoBox(pg) {
    if (!pg) return;
    var w = el('div', { 'class': 'coord' });
    if (pg.cuenta) { w.appendChild(el('p', {}, '<strong>🏦 Puedes hacer tu transferencia a nuestra cuenta:</strong>')); w.appendChild(el('div', { 'class': 'cuentab' }, pg.cuenta)); }
    if (pg.comprobante) { w.appendChild(el('p', { style: 'margin-top:14px' }, '¿Ya la hiciste? Envíanos tu comprobante:')); w.appendChild(el('a', { 'class': 'b2 wa', href: pg.comprobante, target: '_blank', rel: 'noopener' }, 'Enviar comprobante')); }
    card.appendChild(w);
  }
  function apoyo() {
    cabecera();
    if (!NUEVO) card.appendChild(el('p', { 'class': 'intro' }, esEmpresa() ? '¡Qué bueno verte de nuevo! 💙' : '¡Qué bueno verte de nuevo, ' + txt(NOMBRE) + '! 💙'));
    seccion(esEmpresa() ? 'El apoyo de la empresa' : 'Tu apoyo');
    card.appendChild(el('p', { 'class': 'preg' }, esEmpresa() ? '¿Cómo va a apoyar ' + txt(E.empresa) + ' esta actividad?' : '¿Cómo vas a apoyar esta actividad?'));
    card.appendChild(el('p', { 'class': 'ayuda' }, 'Puedes elegir varias.'));
    var tri = INFO.tribu || [], cto = CONTACTO || (I.como === COMO[0] ? I.quien : '');
    if (!S.entrega && cto && tri.indexOf(cto) >= 0) S.entrega = cto;   // v42: precargado con quien lo trajo (lo puede cambiar)
    var bq = bloqueApoyo(INFO.areas, S, tri, INFO.desc || {});   // v47: con descripciones; ya no hay caja general al final (solo Otro aporte lleva texto)
    card.appendChild(bq);
    var er = el('p', { 'class': 'err', role: 'alert' }); card.appendChild(er);
    function guardar() { }
    var env = boton('Enviar', function () {
      if (!S.areas.length) { er.textContent = 'Elige al menos una forma de apoyar.'; return; }
      if (!revisarApoyo(S, bq, er)) return;
      var don = S.areas.some(function (x) { return DIN.test(x); }), otro = S.areas.some(function (x) { return OTRO.test(x); });
      env.disabled = true; cargando();
      var d = Object.assign({ a: id, areas: S.areas, valores: valoresDe(S), forma: don ? S.forma : '', entrega: don && S.forma === 'Efectivo' ? S.entrega : '', otro: otro ? String(S.detalle || '').trim() : '' },
        esEmpresa() ? { tipo: 'empresa', empresa: E.empresa, rnc: E.rnc } : {}, NUEVO || !esEmpresa() ? P : {}, NUEVO ? datosInscripcion() : {});
      api('legadoApoyo', d).then(function (j) {
        if (!j || !j.ok) { apoyo(); card.querySelector('.err').textContent = (j && j.error) || 'No pudimos guardar tu respuesta.'; return; }
        if (j.tribu) return deLaTribu(j.correo);
        cabecera();
        card.appendChild(el('div', { 'class': 'ok' }, j.gracias || ('¡Gracias, ' + txt(j.nombre) + '! 💙')));
        card.appendChild(el('p', { 'class': 'ayuda', style: 'text-align:center' }, 'Te enviamos un correo con el resumen de tu aporte.'));
        pagoBox(j.pago);   // transferencia: cuenta y comprobante; efectivo: nada más
        amigos(j.amigos);
        if (j.coordinar) coordina('¿Necesitas coordinar la entrega de tu aporte?');
      }).catch(function () { apoyo(); card.querySelector('.err').textContent = 'No pudimos conectar. Revisa tu internet e inténtalo de nuevo.'; });
    });
    card.appendChild(env);
    volver('Volver', function () { guardar(); if (NUEVO) { if (esEmpresa()) aporteEmpresa(); else contacto(); } else if (esEmpresa()) empresa1(); else datos(); });
  }

  function inicio() {
    if (!id) {
      INFO = { titulo: 'Legado Piel de Ángel', sub: 'Inscripción' };
      document.title = 'Inscríbete · Legado Piel de Ángel';
      cargando();
      api('legado', { a: '' }).then(function (j) { INVITAN = (j && j.info && j.info.invitan) || []; tipo(); }).catch(function () { tipo(); }).then(listo);
      return;
    }
    cargando();
    api('legado', { a: id }).then(function (j) {
      if (!j || !j.ok || !j.info || !j.info.valida) { card.innerHTML = '<p class="ok">Este enlace no es válido.</p>'; return; }
      INFO = j.info; INVITAN = INFO.invitan || [];
      document.title = INFO.titulo + ' · Legado Piel de Ángel';
      if (INFO.cerrada) {
        cabecera();
        var msg = INFO.cancelada ? 'Esta actividad se canceló.' : 'Las respuestas para esta actividad ya cerraron. ¡Gracias por tu interés! 💙';
        if (INFO.waCoordina) msg += '<br><br>Si quieres apoyar, escríbele a <a href="' + txt(INFO.waCoordina) + '" target="_blank" rel="noopener">' + txt(INFO.coordina) + '</a>.';
        card.appendChild(el('p', { 'class': 'ok' }, msg));
        return;
      }
      tipo();
    }).catch(function () { card.innerHTML = ''; card.appendChild(el('p', { 'class': 'ok' }, 'No pudimos conectar. Revisa tu internet e inténtalo de nuevo.')); card.appendChild(boton('Intentar de nuevo', inicio)); }).then(listo);
  }
  inicio();
})();

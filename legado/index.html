    return function (er) {

  // v36: la inscripción va por bloques: Sobre ti → Para mantenernos en contacto

    talla.value = I.talla || ''; tw.appendChild(el('label', { 'class': 'lb', 'for': 'talla' }, 'Talla de t-shirt')); tw.appendChild(talla); card.appendChild(tw);

    var cta = el('p', { 'class': 'cuenta' }); card.appendChild(cta);

  function campos_contacto() {
    seccion('Para mantenernos en contacto');
    var quienW = el('div', { 'class': 'f', style: 'margin-top:-2px' }), otroW = el('div', { 'class': 'f', style: 'display:none' });
    var lista = INVITAN || [], sel = null, quien = el('input', { 'class': 'campo', id: 'quien', type: 'text', maxlength: '80', autocapitalize: 'words', placeholder: 'Escribe su nombre' });

    radios(opc('¿Cómo conociste el Legado?'), [['Por alguien de Henko', 'Por alguien de Henko'], ['Redes sociales', 'Redes sociales'], ['Otro', 'Otro']], I.como,
      function (v) { I.como = v; quienW.style.display = v === 'Por alguien de Henko' ? 'block' : 'none'; otroW.style.display = v === 'Por alguien de Henko' && sel && sel.value === '__otra' ? 'block' : 'none'; });

  function datosInscripcion() {

  function enviarIns(boton1) {
    boton1.disabled = true; cargando();
    api('legadoInscribir', Object.assign({}, P, datosInscripcion())).then(function (j) {
      if (!j || !j.ok) { contacto(); card.querySelector('.err').textContent = (j && j.error) || 'No pudimos guardar tu inscripción.'; return; }

  // v34: si hay una actividad abierta, se ofrece al terminar la inscripción (si no responde, la invitación le llega al día siguiente)
  function abiertas(l) {

  function irA(a) {

      if (!j || !j.ok || !j.info || !j.info.valida || j.info.cerrada) return error('Las respuestas para esta actividad ya cerraron.');

  // ---- v36: Bloque 1 · Tus datos (los dos links). Si ya está inscrito (3 o 4 datos iguales), vuelve a escribir sus datos y se actualizan

        if (!j || !j.ok) return error((j && j.error) || 'No pudimos continuar.');
        if (j.tribu) return deLaTribu(j.correo);
        NUEVO = !j.inscrito; NOMBRE = j.nombre || P.nombre;

    cabecera();

  function inicio() {
    if (!id) {
      INFO = { titulo: 'Legado Piel de Ángel', sub: 'Inscripción' };
      document.title = 'Inscríbete · Legado Piel de Ángel';
      cargando();

    }

    api('legado', { a: id }).then(function (j) {

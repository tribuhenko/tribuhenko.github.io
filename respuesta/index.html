<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu respuesta · Tribu Henko V-120</title>
<meta name="description" content="Responde la invitación de la Tribu Henko V-120.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#D21F1F">
<link rel="icon" type="image/png" href="../assets/logo.png">
<link rel="apple-touch-icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#F4F1ED;--card:#FFFFFF;--tx:#1C1A19;--tx2:#5E5853;--tx3:#8F8882;--bd:#E4DFD9;--ac:#D21F1F;--sombra:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0D0C0C;--card:#191717;--tx:#F4F1EE;--tx2:#BDB5AD;--tx3:#8A827B;--bd:#2F2B29;--ac:#FF5A5A;--sombra:none}}
body.legado{--ac:#0B6E91;--bg:#EEF6FA;--bd:#D5E5EE}
@media (prefers-color-scheme:dark){body.legado{--ac:#6FD0F0;--bg:#0A1116;--bd:#253744}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:28px 16px 40px;text-align:center}
.logos{display:flex;justify-content:center;align-items:center;gap:18px}
.logos img{height:84px;width:auto}
.logos .piel{display:none}
body.legado .logos{flex-direction:column;gap:6px}
body.legado .logos .piel{display:block;height:128px;order:1}
body.legado .logos .henko{height:46px;order:2;opacity:.9}
.preg{margin:20px 0 8px;font-weight:700;font-size:16px;text-align:left}
.ayuda{margin:-4px 0 10px;color:var(--tx2);font-size:14px;text-align:left}
.chips{display:flex;flex-direction:column;gap:8px;text-align:left}
.chip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;font-size:16px;cursor:pointer;background:var(--card)}
.chip input{width:20px;height:20px;accent-color:var(--ac);margin:0;flex:none}
.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--card))}
.campo{width:100%;box-sizing:border-box;border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;font:16px Montserrat,system-ui,sans-serif;background:var(--card);color:var(--tx)}
.campo:focus{outline:2px solid var(--ac);outline-offset:1px}
.err{color:#C62828;font-size:14px;margin:8px 0 0;text-align:left;min-height:1px}
.enviar{margin-top:20px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sombra);padding:24px 18px 18px;margin-top:18px;border-top:5px solid var(--ac)}
h1{margin:0 0 4px;font-size:21px;line-height:1.3}
.sub{margin:0 0 18px;color:var(--tx2);font-size:15px}
.msg{font-size:17px;line-height:1.55;margin:0 0 18px}
.msg strong{color:var(--ac)}
.nota{margin:14px 0 10px;color:var(--tx2);font-size:15px}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 6px}
.b{appearance:none;border:0;border-radius:24px;padding:12px 20px;font:700 16px Montserrat,system-ui,sans-serif;color:#fff;cursor:pointer;text-decoration:none;display:inline-block;min-width:120px}
.b[disabled]{opacity:.55;cursor:default}
.b:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.extra{border-top:1px solid var(--bd);margin-top:16px;padding-top:16px}
.extra p{margin:0 0 12px;font-size:15px;line-height:1.5}
.cargando{color:var(--tx2);font-size:15px;padding:18px 0}
.hola{margin:2px 0 14px;text-align:center;font-size:16px;color:var(--tx)}
.coord p{margin:0 0 10px}
.punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin:0 3px;animation:p 1s infinite ease-in-out}
.punto:nth-child(2){animation-delay:.15s}.punto:nth-child(3){animation-delay:.3s}
@keyframes p{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.punto{animation:none}}
footer{margin-top:18px;color:var(--tx3);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="logos"><img class="henko" src="../assets/logo.png" alt="Tribu Henko V-120"><img class="piel" src="../assets/logo-legado.png" alt="Legado Piel de Ángel"></div>
  <div class="card" id="card" aria-live="polite">
    <div class="cargando" id="cargando"><span class="punto"></span><span class="punto"></span><span class="punto"></span><p>Cargando…</p></div>
  </div>
  <footer>Tribu Henko V-120</footer>
</main>
<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbx65fG9CJsgVDX0rhgzdNXwJ52ahDx_A92Zlg9dGRraegVWk8PQhcDVQP788giDitxw6Q/exec";
  var q = new URLSearchParams(location.search);
  var r = q.get('r') || '';
  var card = document.getElementById('card');
  var COLORES = { si: '#1E9E5A', quizas: '#D99A00', no: '#8A8580' };
  // v24: el enlace dice si es del Legado (empieza con "L|"): la página sale con los colores del Legado desde que abre
  try { var t0 = r.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'); if (/^L\|/.test(atob(t0 + '==='.slice((t0.length + 3) % 4)))) { document.body.classList.add('legado'); document.title = 'Legado Piel de Ángel · Tribu Henko V-120'; var ft = document.querySelector('footer'); if (ft) ft.textContent = 'Legado Piel de Ángel · Tribu Henko V-120'; var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', '#0B6E91'); } } catch (e) { /* enlace viejo */ }

  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function txt(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function cargando() {
    card.innerHTML = '<div class="cargando"><span class="punto"></span><span class="punto"></span><span class="punto"></span><p>Un momento…</p></div>';
  }
  function error(a, ok) {
    card.innerHTML = '';
    card.appendChild(el('p', { 'class': 'msg' }, 'No pudimos conectar. Revisa tu internet e inténtalo de nuevo.'));
    var b = el('button', { 'class': 'b', type: 'button', style: 'background:var(--ac)' }, 'Intentar de nuevo');
    b.onclick = function () { pedir(a, ok); };
    card.appendChild(b);
  }
  var LF = null, EX = null;
  function pedir(a, ok, extra) {
    cargando();
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, 30000);
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', cache: 'no-store', redirect: 'follow',
      body: JSON.stringify({ accion: 'respuesta', datos: Object.assign({ r: r, a: a || '', ok: ok ? '1' : '' }, extra || {}) }), signal: ctl ? ctl.signal : undefined })
      .then(function (x) { return x.json(); })
      .then(function (j) { clearTimeout(t); if (!j || !j.ok || !j.pagina) throw new Error('sin datos'); pintar(j.pagina); })
      .catch(function () { clearTimeout(t); error(a, ok); });
  }
  function boton(x, texto, ok) {
    var b = el('button', { 'class': 'b', type: 'button', style: 'background:' + (COLORES[x] || 'var(--ac)') }, txt(texto));
    b.onclick = function () { pedir(x, ok); };
    return b;
  }
  // Saludo con el nombre: el enlace es personal y la respuesta queda a nombre de quien lo recibió
  function hola(p) { if (p.hola) card.appendChild(el('p', { 'class': 'hola' }, 'Hola, <strong>' + txt(p.hola) + '</strong> 👋')); }
  // Legado: botón para escribirle por WhatsApp a quien coordina (Elizabeth)
  function coordina(p) {
    if (!p.coordina || !p.coordina.wa) return;
    var w = el('div', { 'class': 'extra coord' });
    w.appendChild(el('p', {}, '¿Quieres entregar una donación o tienes alguna pregunta?'));
    var bw = el('div', { 'class': 'btns' });
    bw.appendChild(enlace(p.coordina.wa, 'Escribirle a ' + String(p.coordina.nombre || '').split(' ')[0], '#1E9E5A'));
    w.appendChild(bw); card.appendChild(w);
  }
  function enlace(url, texto, color) {
    return el('a', { 'class': 'b', href: url, target: '_blank', rel: 'noopener', style: 'background:' + color }, txt(texto));
  }
  // Legado: ¿cómo participarás? + ¿cómo vas a apoyar? (varias) + monto si es donación + detalle
  function formLegado(p) {
    var f = p.legadoForm, act = f.actual || {}, sel = { a: p.confirmar || act.a || '', areas: (act.areas || []).slice(), monto: act.monto || '', detalle: act.detalle || '' };
    card.innerHTML = '';
    card.appendChild(el('h1', {}, txt(p.titulo)));
    if (p.sub) card.appendChild(el('p', { 'class': 'sub' }, txt(p.sub)));
    hola(p);
    if (act.a) card.appendChild(el('p', { 'class': 'nota' }, 'Puedes cambiar tu respuesta aquí.'));
    card.appendChild(el('p', { 'class': 'preg' }, '¿Cómo participarás en esta actividad?'));
    var c1 = el('div', { 'class': 'chips', role: 'radiogroup' });
    Object.keys(f.opciones).forEach(function (k) {
      var l = el('label', { 'class': 'chip' + (sel.a === k ? ' on' : '') });
      var i = el('input', { type: 'radio', name: 'q1', value: k }); if (sel.a === k) i.checked = true;
      i.onchange = function () { sel.a = k; [].forEach.call(c1.children, function (x) { x.classList.toggle('on', x === l); }); };
      l.appendChild(i); l.appendChild(el('span', {}, txt(f.opciones[k]))); c1.appendChild(l);
    });
    card.appendChild(c1);
    card.appendChild(el('p', { 'class': 'preg' }, '¿Cómo vas a apoyar esta actividad?'));
    card.appendChild(el('p', { 'class': 'ayuda' }, 'Puedes elegir varias.'));
    var c2 = el('div', { 'class': 'chips' }), mw = el('div', { style: 'display:none;margin-top:10px' });
    var monto = el('input', { 'class': 'campo', type: 'text', inputmode: 'numeric', placeholder: 'Monto aproximado en RD$ (opcional)', maxlength: '12' }); monto.value = sel.monto || '';
    mw.appendChild(monto);
    function verMonto() { mw.style.display = sel.areas.some(function (a) { return /donaci/i.test(a); }) ? 'block' : 'none'; }
    f.areas.forEach(function (a) {
      var l = el('label', { 'class': 'chip' + (sel.areas.indexOf(a) >= 0 ? ' on' : '') });
      var i = el('input', { type: 'checkbox', value: a }); if (sel.areas.indexOf(a) >= 0) i.checked = true;
      i.onchange = function () { var k = sel.areas.indexOf(a); if (i.checked && k < 0) sel.areas.push(a); if (!i.checked && k >= 0) sel.areas.splice(k, 1); l.classList.toggle('on', i.checked); verMonto(); };
      l.appendChild(i); l.appendChild(el('span', {}, txt(a))); c2.appendChild(l);
    });
    card.appendChild(c2); card.appendChild(mw); verMonto();
    card.appendChild(el('p', { 'class': 'preg' }, '¿Puedes especificar cómo vas a apoyar tu Legado?'));
    var det = el('textarea', { 'class': 'campo', rows: '3', maxlength: '600', placeholder: 'Opcional: qué vas a aportar, cuánto o cualquier detalle' }); det.value = sel.detalle;
    card.appendChild(det);
    var er = el('p', { 'class': 'err', role: 'alert' }); card.appendChild(er);
    var b = el('button', { 'class': 'b enviar', type: 'button', style: 'background:var(--ac)' }, 'Enviar mi respuesta');
    b.onclick = function () {
      if (!sel.a) { er.textContent = 'Elige si vas al Legado.'; return; }
      pedir(sel.a, true, { areas: sel.areas, monto: monto.value.replace(/\D/g, ''), detalle: det.value.trim() });
    };
    card.appendChild(b);
    coordina(p);
  }
  function pintar(p) {
    document.body.classList.toggle('legado', !!p.legado);
    if (p.legadoForm && !p.cerrada && (p.confirmar || !p.legadoForm.actual || p.editar)) { formLegado(p); return; }
    document.title = p.titulo && p.titulo !== 'Tribu Henko V-120' ? p.titulo + ' · Tribu Henko V-120' : 'Tu respuesta · Tribu Henko V-120';
    card.innerHTML = '';
    card.appendChild(el('h1', {}, txt(p.titulo)));
    if (p.sub) card.appendChild(el('p', { 'class': 'sub' }, txt(p.sub)));
    hola(p);
    card.appendChild(el('div', { 'class': 'msg' }, p.html));
    var bot = p.botones || { si: 'Sí voy', quizas: 'Quizás', no: 'No voy' };
    if (p.confirmar) {
      var c = el('div', { 'class': 'btns' });
      c.appendChild(boton(p.confirmar, 'Confirmar', true));
      card.appendChild(c);
    }
    if (p.calendario) {
      var k = el('div', { 'class': 'extra' });
      k.appendChild(el('p', {}, p.calendario.texto));
      var kb = el('div', { 'class': 'btns' });
      kb.appendChild(enlace(p.calendario.google, 'Google Calendar (Android)', '#1A73E8'));
      kb.appendChild(enlace(p.calendario.ics, 'iPhone (Apple)', '#111111'));
      k.appendChild(kb);
      card.appendChild(k);
    }
    if (p.grupo) {
      var g = el('div', { 'class': 'extra' });
      g.appendChild(el('p', {}, p.grupo.texto));
      var gb = el('div', { 'class': 'btns' });
      gb.appendChild(enlace(p.grupo.url, p.grupo.boton, '#1E9E5A'));
      g.appendChild(gb);
      card.appendChild(g);
    }
    if (p.legadoForm && !p.cerrada) {
      var lf = p.legadoForm.actual;
      if (lf && (lf.areas.length || lf.detalle)) card.appendChild(el('p', { 'class': 'nota' }, txt('Tu apoyo: ' + lf.areas.join(', ') + (lf.monto ? ' (RD$' + Number(lf.monto).toLocaleString('en-US') + ')' : '') + (lf.detalle ? ' · ' + lf.detalle : ''))));
      var cb = el('button', { 'class': 'b', type: 'button', style: 'background:var(--ac)' }, 'Cambiar mi respuesta');
      cb.onclick = function () { pintar(Object.assign({}, p, { editar: true, confirmar: '' })); };
      var w0 = el('div', { 'class': 'extra' }); w0.appendChild(cb); card.appendChild(w0);
      coordina(p);
      return;
    }
    if (p.opciones && p.opciones.length) {
      var nota = p.confirmar ? '¿Era otra opción?' : p.otra;
      var w = el('div', { 'class': (p.calendario || p.grupo) ? 'extra' : '' });
      if (nota) w.appendChild(el('p', { 'class': 'nota' }, txt(nota)));
      var o = el('div', { 'class': 'btns' });
      p.opciones.forEach(function (x) { o.appendChild(boton(x, bot[x] || x, true)); });
      w.appendChild(o);
      card.appendChild(w);
    }
  }
  if (!r) { pintar({ titulo: 'Tribu Henko V-120', html: 'Este enlace no es válido.', opciones: [] }); return; }
  // Al abrir solo se muestra: la respuesta se guarda cuando la persona toca un botón
  pedir(q.get('a') || '', false);
})();
</script>
</body>
</html>
